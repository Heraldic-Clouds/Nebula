name: Nebula checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real host-probe tools on the disposable CI runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 openvswitch-switch
          sudo systemctl start openvswitch-switch
      - name: Execute guest CPU and networking privilege probes
        run: |
          sudo python3 - <<'PY'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('preflight', 'scripts/preflight.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          print(json.dumps({'environment': 'GitHub CI, not ThreeFold', 'development_only': True,
              'cpu': probe.guest_probe('tcg'), 'network_privileges': probe.privilege_probe()}))
          PY
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: nebula
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: nebula_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nebula -d nebula_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEBULA_TEST_DATABASE_URL: postgresql+psycopg://nebula:local_ci_only@localhost:5432/nebula_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: pip install -r infra/kolla/requirements.txt
      - name: Ansible playbook syntax (no SSH or deployment)
        run: |
          ansible-playbook -i 'localhost,' --syntax-check infra/kolla/prepare.yml
          ansible-playbook -i 'localhost,' --syntax-check infra/kolla/preflight.yml
      - run: docker build -t nebula:ci .
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: pnpm/action-setup@v4
        with: {version: '10.11.0'}
      - run: pnpm install --frozen-lockfile
        working-directory: apps/dashboard
      - run: pnpm build
        working-directory: apps/dashboard
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.16.6'}
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      # No wallet, plan, apply, SSH or infrastructure deployment in CI.
