services:
  proxy:
    image: nginx:stable-alpine
    ports: ['443:443']
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NEBULA_TLS_CERT:?Set the verified TLS certificate path}:/etc/nginx/tls/fullchain.pem:ro
      - ${NEBULA_TLS_KEY:?Set the private TLS key path}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
